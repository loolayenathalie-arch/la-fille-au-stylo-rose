<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
<!-- Image provisoire : chien brun caramel assis (silhouette simple, grain d'aquarelle). Remplace ce fichier par ton illustration (même nom, fond transparent). -->
<defs>
 <filter id="aq" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="5" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="7" result="d"/>
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11" result="g"/>
  <feColorMatrix in="g" type="matrix" values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .22  0 0 0 .55 -.12" result="gc"/>
  <feComposite in="gc" in2="d" operator="in" result="gi"/>
  <feMerge><feMergeNode in="d"/><feMergeNode in="gi"/></feMerge>
 </filter>
</defs>
<g filter="url(#aq)" stroke="#A07E5F" stroke-width="4">
 <ellipse cx="118" cy="276" rx="21" ry="11" fill="#B69575"/>
 <ellipse cx="182" cy="276" rx="21" ry="11" fill="#B69575"/>
 <ellipse cx="150" cy="205" rx="72" ry="76" fill="#B69575"/>
 <ellipse cx="150" cy="226" rx="38" ry="48" fill="#DCC3A0" stroke="none"/>
 <ellipse cx="92" cy="112" rx="20" ry="38" transform="rotate(14 92 112)" fill="#A07E5F"/>
 <ellipse cx="208" cy="112" rx="20" ry="38" transform="rotate(-14 208 112)" fill="#A07E5F"/>
 <circle cx="150" cy="106" r="58" fill="#B69575"/>
 <ellipse cx="150" cy="126" rx="30" ry="22" fill="#DCC3A0" stroke="none"/>
 <ellipse cx="150" cy="114" rx="10" ry="7" fill="#7C5C43" stroke="none"/>
 <circle cx="128" cy="95" r="4.5" fill="#5B4330" stroke="none"/>
 <circle cx="172" cy="95" r="4.5" fill="#5B4330" stroke="none"/>
</g>
</svg>
